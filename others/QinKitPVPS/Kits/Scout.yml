  1'
- 'console: item replace entity %player% armor.chest with diamond_chestplate[attribute_modifiers=[{id:"armor",type:"generic.armor",amount:1.0d,operation:"add_value",slot:"chest"},{id:"armor",type:"generic.movement_speed",amount:0.05d,operation:"add_multiplied_base",slot:"chest"}]]
  1'
- 'console: item replace entity %player% armor.legs with chainmail_leggings[enchantments={levels:{"minecraft:protection":1}},attribute_modifiers=[{id:"armor",type:"generic.armor",amount:2.0d,operation:"add_value",slot:"legs"}]]
  1'
