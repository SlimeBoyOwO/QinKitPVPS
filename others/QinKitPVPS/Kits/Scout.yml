      Material: IRON_SWORD
      Lore:
      - '  &8● &3操灵术（被动效果） &7: &a斯铐能持有的雪球上限至多为3，且当断魂与聚魂同时存在时，雪球将同时引导两个灵体；当一个灵体进入“虚空”或死亡时，另一个灵体短时间内会召唤失败。'
    '1':
      Name: '&a狂猎'
      Material: LEAD
      Lore:
      - '  &8● &3狂猎&7: &7进入&a5S隐身，虚弱6；&7技能开启瞬间，令所有&a被标记为“猎物”，持续120s&7的其他玩家获得&a5s发光；&7技能开启后或结束后，为&a半径7格&a7内最近的的其他玩家&a给予“猎物”标记&7（已经拥有此标记的敌人不会再获得）'
    '2':
