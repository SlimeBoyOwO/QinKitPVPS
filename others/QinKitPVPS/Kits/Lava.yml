    Amplifier: 1
    Duration: 100000
  GLOWING:
    Amplifier: 1
    Duration: 100000
  SPEED:
    Amplifier: 5
    Duration: 3
  JUMP:
    Amplifier: 2
    Duration: 3
Commands:
- 'console: tag %player% add Lava'

