Introduction:
- '&7>> &b&l蝰蛇 &7-->'
- '&7生命：&a40  &7防御：&a16  &7攻击：&a7'
- '&7上手难度：&f★★★★☆'
- '  &8● &3充能 &7: &7蝰蛇每秒会增加&a20点&7充能，直至其上限&a1800点，&7此外，蝰蛇&a免疫“中毒”'
- '  &8● &3毒之狂潮 &7: &7以自身为中心，半径&a6格&7所在的其他玩家为对象，令他们获得&a“中毒”，&7同时&a驱散&7其身上的&a“伤害吸收”和“隐身”；&7对半径&a4格&7以内的敌人使用时，&a“中毒”&7的&a等级会更高且持续时间更久'
- '  &8● &3毒之汲取 &7: &7以自身为中心，半径&a7格&7所在的最近一名其他玩家为对象，&a驱散&7该玩家身上的&a“凋零”，“中毒”，“失明”，“黑暗”，“发光”，“饥饿”&7效果；成功释放时，自己会失去一定的生命值，但会获得更高数值的&a“伤害吸收”，&7同时增加&a100点&7充能。'
- '  &8● &3蛇腹 &7: &7消耗&a1000&7点充能才能使用；以自身为中心，释放半径&a16&7格的“毒幕”（不会随着蝰蛇的移动而移动,蝰蛇自己离开毒幕范围后，毒幕将立刻消失。），进入“毒幕”的玩家在离开或进入“毒幕”的瞬间都会受到&a“中毒”，“虚弱”，“减速”，“发光”&7效果；如果是生命值&a＞20&7的玩家还会获得短暂的&a“失明”&7效果，生命值&a<20&7的玩家则获得短暂的&a“黑暗”&7效果；&a蝰蛇和上一个受到“毒之汲取”效果的玩家&不会收到“蛇腹”的负面效果，&7同时在&a“毒幕”范围内&7，蝰蛇将会获得&a“速度”，“抗性提升”，“跳跃提升”效果。'
- '  &8● &3毒爆 &7: &7受蝰蛇技能影响的&a所有玩家&7将会被标记&a“毒”；&7释放此技能时，&a引爆&7所有玩家身上的“毒”标记，并&a驱散&7蝰蛇身上的所有效果，蝰蛇&a失去对“中毒”的抗性&7的同时获得&a200&7点充能；然后，那些身上&a有“毒”标记&7的玩家都会受到伤害，并对周围其他&a所有持有“毒”标记&7的玩家造成伤害。'
