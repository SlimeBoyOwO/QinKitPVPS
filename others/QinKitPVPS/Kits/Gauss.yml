- '  &8● &3马赫冲驰 &7: &7获得&a4s速度4&7；这个技能&a连续使用&7的场合，每使用1次，速度的&a等级+3（至多+12）&7；当&a连续使用技能4次&7时，自身会获得&a动能镀层&7，&a获得抗性提升1&7,并且在靠近敌人时将对他们&a造成动能伤害&7并给予他们&a缓慢2&7；每使用1次马赫冲驰，便会&a计数1次&7（称为为马赫计数），当&a达到5次&7时，高斯&a15s内无法使用马赫冲驰&7，并重置计数，清除自身速度的同时获得&a15s缓慢5'
- '  &8● &3电光石火 &7: &7在自身所在&a平面&7爆发出&a面积为81格的正方形火焰&7，处于技能范围内的其他玩家将受到&a4s缓慢3，虚弱1&7；马赫计数达到&a>=4&7的场合，不会召唤火焰，而是在&a半径6格内&7的所有其他玩家的位置&a召唤一条闪电束&7,并对他们造成&a8点伤害&7；马赫&a计数为5&7的场合，使自己的马赫&a计数-1'
- '  &8● &3迅电驰影 &7: &7获得&a饱和2&7以及&a8s发光，速度21&7；持续时间内，自己&a无法使用马赫冲驰&7，并获得&a强化&7版的&a动能镀层（生效范围+1，每次伤害+1，抗性提升等级+1）&7；&a通过此技能&7让马赫&a计数到达6&7的场合，&a不受其负面效果影响&7；持续时间内，每过1S，在&a自己身后4格处&7召唤一条&a闪电束&7；持续时间内，使用&a电光石火&7时，拥有&a额外&7效果：对自身周围&a半径8格&7内的&a最近的敌人&7造成&a16点动能伤害'
