Activator:
  Material: SOUL_TORCH
  Name: 恶魔
Commands:
- 'console: execute as %player% at @s run give @s soul_lantern[custom_name=''"天使武器A"'']
  1'
- 'console: execute as %player% run clear @s elytra'
- 'console: execute as %player% run clear @s firework_star'
- 'console: execute as %player% run clear @s amethyst_shard'
- 'console: execute as %player% at @s run tag @s add sword'
- 'console: execute as %player% at @s run tag @s remove gun'
- 'console: execute as %player% at @s run tag @s remove dante'
- 'console: execute as %player% at @s run effect give @s speed infinite 1 true'
- 'console: execute as %player% at @s run effect give @s slow_falling infinite'
- 'console: execute as %player% at @s run effect give @s strength 8 0 true'
- 'console: execute as %player% at @s run effect give @s invisibility infinite'
- 'console: execute as %player% at @s run effect give @s jump_boost infinite'
- 'console: execute as %player% at @s run scoreboard players set @s reload 0'
- 'console: execute as %player% at @s run give @s ender_eye[custom_name=''"地狱之眼"'']
  1'
- 'console: execute as %player% at @s run give @s fire_charge[custom_name=''"地狱重压"'']
  1'
- 'console: execute as %player% at @s run give @s goat_horn[custom_name=''"恶魔之力"'']
  1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:firework_star",Count:2b}]}]
  run clear @s firework_star 1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:amethyst_shard",Count:2b}]}]
  run clear @s amethyst_shard 1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:ender_eye",Count:2b}]}]
  run clear @s ender_eye 1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:fire_charge",Count:2b}]}]
  run clear @s fire_charge 1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:goat_horn",Count:2b}]}]
  run clear @s goat_horn 1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:rail",Count:2b}]}]
  run clear @s rail 1'
- 'console: execute as %player% if entity @s[nbt={Inventory:[{id:"minecraft:elytra",Count:2b}]}]
  run clear @s elytra 1'
