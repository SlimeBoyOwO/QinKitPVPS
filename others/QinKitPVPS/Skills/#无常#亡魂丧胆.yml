Activator:
  Name: '&a亡魂丧胆'
Commands:
- 'console: execute as %player% at @s[scores={health=..8}] run playsound minecraft:entity.wither.spawn
  voice @s ~ ~ ~ 1 2'
- 'console: execute as %player% at %player% run tellraw @s[scores={health=2..}] [{"color":"red","text":"还不能"},{"color":"black","text":"使用"}]'
- 'console: execute as %player% at @s[scores={health=..8}] run tag @a[distance=1..200,scores={health=..8}]
  add ZS'
- 'console: execute as %player% at @s[scores={health=8..}] run item replace entity
  @a[tag=ZS] container.19 with totem_of_undying 1'
- 'console: execute as %player% at %player% run tellraw @s[scores={health=9..}] [{"color":"red","text":"还没"},{"color":"black","text":"准备好"}]'
- 'console: execute as %player% at %player% run tellraw @a[distance=1..8,scores={health=..15}]
  {"color":"red","text":"别说我不给你机会"}'
CoolDown:
  CoolDown: 40S
