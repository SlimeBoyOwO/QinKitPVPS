Activator:
  Material: OAK_SIGN
  Name: '&b裂隙锚点'
Commands:
- 'console: execute as %player% at @s run kill @e[type=minecraft:armor_stand,tag=WTBL] '
- 'console: execute as %player% at %player% run summon armor_stand ~4 ~6 ~5 {Invisible:1b,Tags:["WTBL"],Pose:{Body:[0f,0f,0f],LeftArm:[0f,0f,0f],RightArm:[0f,0f,0f],LeftLeg:[0f,0f,0f],RightLeg:[0f,0f,0f],Head:[0f,0f,0f]},Rotation:[0F,NaNF]}'
- 'console: execute as %player% at @s[nbt={Inventory:[{Slot:-106b,id:"minecraft:iron_sword"}]}]
  run kill @e[tag=LXMD,type=minecraft:armor_stand] '
- 'console: execute as %player% at @s[nbt={Inventory:[{Slot:-106b,id:"minecraft:iron_sword"}]}]
  run particle happy_villager ~ ~ ~ 2 2 2 0 15 force'
- 'console: execute as %player% at @s[nbt={Inventory:[{Slot:-106b,id:"minecraft:iron_sword"}]}]
  run playsound minecraft:entity.experience_orb.pickup voice @s ~ ~ ~ 1 0.8'
- 'console: execute as %player% at @s[nbt={Inventory:[{Slot:-106b,id:"minecraft:nether_star"}]}]
  run particle totem_of_undying ~ ~ ~ 0.5 4 0.5 0 50 force'
