  run tp @e[distance=0..7,tag=LXMD,type=minecraft:armor_stand,limit=1] '
- 'console: execute as %player% at @s[nbt={Inventory:[{Slot:-106b,id:"minecraft:nether_star"}]}]
  run particle totem_of_undying ~ ~ ~ 0.5 4 0.5 0 50 force'
