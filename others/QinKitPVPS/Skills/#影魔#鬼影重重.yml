Activator:
  Name: '&a鬼影重重'
Commands:
- 'console: effect give %player% slowness 1 1 true'
- 'console: execute as %player% at @s run playsound minecraft:entity.wither.shoot
  ambient @a'
- 'delay: 20'
- 'console: execute as %player% at %player% run effect give @s night_vision 6 0'
- 'console: execute as %player% at %player% run effect give @s darkness 6 0'
- 'console: execute as %player% at %player% run particle entity_effect{color:[1.000,1.000,1.000,1.00]}
  ~ ~1 ~ 0 0 0 0 700 force'
- 'console: execute as %player% at %player% run summon armor_stand ~ ~ ~ {NoGravity:1b,Invisible:1b,NoBasePlate:1b,Tags:["shadowF1"],Pose:{Head:[30f,0f,0f]},DisabledSlots:31,ArmorItems:[{id:"minecraft:leather_boots",Count:1b},{},{id:"minecraft:leather_chestplate",Count:1b},{id:"minecraft:jack_o_lantern",Count:1b}]}'
- 'console: execute as %player% at %player% run tag @p[distance=1..10] add kongju '
- 'console: execute as %player% at %player% run playsound minecraft:entity.wither.hurt
  voice @p[distance=1..10] ~ ~ ~ 1 0.1 '
- 'console: execute as %player% at %player% run item replace entity @e[distance=0..15,tag=shadowF1]
  armor.feet with leather_boots[enchantments={levels:{"minecraft:feather_falling":3,"minecraft:depth_strider":3,"minecraft:soul_speed":3}},attribute_modifiers=[{id:"armor",type:"generic.movement_speed",amount:0.08d,operation:"add_multiplied_base",slot:"feet"},{id:"armor",type:"generic.armor",amount:12.0d,operation:"add_value",slot:"feet"},{id:"armor",type:"generic.armor_toughness",amount:5.0d,operation:"add_value",slot:"feet"}],dyed_color=16777215]
  1'
- 'console: execute as %player% at %player% run item replace entity @e[distance=0..15,tag=shadowF1]
  armor.chest with leather_chestplate[enchantments={levels:{"minecraft:protection":1}},dyed_color=0]
  1'
- 'console: execute as %player% at %player% run item replace entity @e[distance=0..15,tag=shadowF1]
  weapon.offhand with iron_sword[enchantments={levels:{"minecraft:sharpness":1}}]
  1'
- 'console: execute as %player% at %player% run gamemode spectator '
- 'console: execute as %player% at %player% run tag @s add shadowF2 '
- 'console: execute as %player% at %player% run playsound minecraft:entity.warden.roar
  voice @a[distance=0..10] ~ ~ ~ 2 0.1 '
CoolDown:
  CoolDown: 60S
