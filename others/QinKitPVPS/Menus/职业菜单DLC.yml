  '9':
    DisplayName: '&7[>&e&l高斯&7<]>&#000000>&l厕所qwq总部<&#5b75ee<'
    Material: DIAMOND_BOOTS
    Lore:
    - '&#ee8dfc&l造物    &7&l游击'
    - '&e&o=-=-=-=-=-=-=-=-=-=-=-='
    - '&7他是电与光的化身，其所到之处，电光石火紧跟其后'
    - '&7他往往不需要自己出手，便能将敌人击败'
    - '&e&o=-=-=-=-=-=-=-=-=-=-=-='
    - '&#d96562&l生命：&b||||||||||||||&7|||||| &f60.0'
    - '&#c776db&l攻击：&b||||||||||||||||||||||  &f0.0'
    - '&#997c2b&l防御：&b|||||||||||||&7|||||||  &f16+5'
    - '&e&o=-=-=-=-=-=-=-=-=-=-=-='
    - '&a【马赫冲驰】高斯将闪电的力量传导至自己身上，获得速度加成'
    - '&a【电光石火】高斯引导电与光的力量，召唤火焰与闪电'
    - '&a【迅电驰影】高斯将电与光的力量结合起来，短时间内强化自身。'
    LeftClickCommands:
    - 'player: qinkit kit Gauss'
    - 'console: execute as %player% at @s run playsound minecraft:entity.fishing_bobber.splash
      ambient @s'
    - '[close]'
    RightClickCommands:
    - 'player: qinkit intro Gauss'
    - '[close]'
