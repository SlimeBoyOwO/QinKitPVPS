  '9':
    DisplayName: '&7[>&#ee8dfc&l剧毒蟒蛇&7<]'
    Material: VINE
    Lore:
    - '&#ee8dfc&l造物    &b&l精准'
    - '&e&o=-=-=-=-=-=-=-=-=-=-=-='
    - '&7森林的野兽随时潜伏着袭击猎兽'
