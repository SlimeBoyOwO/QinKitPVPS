  '10':
    DisplayName: '&7[>&b&l是否开启蹬墙跳&7<]'
    Material: Rabbit_Foot
    Lore:
    - '&8===================='
    - '&#CCCCFF开启这个选项会让你无法蹬墙跳！'
    - '&#CCCCFF如果因为经常弹开厌倦可选择'
    - '&8===================='
    - '&b→ &a左键 &b开启   &b→ &a右键 &c关闭'
    LeftClickCommands:
